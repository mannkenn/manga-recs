query Page($page: Int, $perPage: Int, $type: MediaType, $averageScoreGreater: Int, $popularityGreater: Int) {
  Page(page: $page, perPage: $perPage) {
    media(type: $type, averageScore_greater: $averageScoreGreater, popularity_greater: $popularityGreater) {
      title {
        english
        romaji
        native
      }
      tags {
        name
        category
        description
      }
      popularity
      chapters
      averageScore
      startDate {
        month
        year
      }
      endDate {
        month
        year
      }
      genres
      favourites
      meanScore
      isAdult
      id
      volumes
      description
      # Creators. Sorted by relevance so the primary staff come first, and
      # capped because the tail of a popular title is translators, letterers,
      # and assistants for every licensed edition. Roles are filtered during
      # cleaning; the API has no way to request only authors.
      staff(sort: [RELEVANCE], perPage: 12) {
        edges {
          role
          node {
            id
            name {
              full
            }
          }
        }
      }
    }
    pageInfo {
      hasNextPage
    }
  }
}