name: manga-recs

services:
  # Local stand-in for AWS S3 / Cloudflare R2. Because the application talks to
  # an S3-compatible endpoint rather than AWS specifically, the pipeline, tests,
  # and CI all run against this with no cloud account required.
  minio:
    image: minio/minio:latest
    container_name: manga-recs-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the bucket once MinIO is healthy, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/manga-recs &&
      echo 'Bucket manga-recs ready'
      "

  api:
    build: .
    container_name: manga-recs-api
    profiles: ["api"]
    ports:
      - "8000:8000"
    environment:
      MANGA_RECS_S3_ENDPOINT_URL: http://minio:9000
      MANGA_RECS_S3_BUCKET: manga-recs
      MANGA_RECS_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  minio-data:
