name: manga-recs

services:
  # Local stand-in for AWS S3 / Cloudflare R2. Because the application talks to
  # an S3-compatible endpoint rather than AWS specifically, the pipeline, tests,
  # and CI all run against this with no cloud account required.
  minio:
    image: minio/minio:latest
    container_name: manga-recs-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the bucket once MinIO is healthy, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/manga-recs &&
      echo 'Bucket manga-recs ready'
      "

# There is deliberately no api service here. The serving image bakes its
# artifacts in and never reads the object store, so running it needs nothing from
# this file: use `make docker-run`, or `make docker-smoke` to boot it under the
# read-only filesystem Hugging Face Spaces gives it.

volumes:
  minio-data:
