[paths]
data_dir = "data"
artifacts_dir = "artifacts"

# Any S3-compatible object store. Leave endpoint_url empty for AWS S3; set it to
# a Cloudflare R2 or MinIO endpoint to run the same code against those instead.
[storage]
bucket = "manga-recs"
endpoint_url = ""
region = "auto"

[api]
graphql_url = "https://graphql.anilist.co"
# Tuned against the real title index: genuine queries (including typos and
# romaji) score >= 69, while junk queries top out around 60.
fuzzy_match_threshold = 65
# Abuse protection for the public demo, enforced per client per minute in this
# process only. Generous enough that a human clicking around never sees it, low
# enough that a scripted loop does. A single free-tier container is the whole
# deployment, so there is nothing to share state with.
rate_limit_per_minute = 60
rate_limit_enabled = true
# Off by default because X-Forwarded-For is client-supplied and spoofable, so
# trusting it without a proxy in front hands out a trivial bypass. Turn it on
# when the container genuinely sits behind one - Hugging Face Spaces does, and
# without it every visitor there shares one apparent address.
trust_forwarded_for = false

[ingestion]
# Requests per minute. AniList publishes 90/min but frequently serves a
# degraded 30/min, and the client backs off on 429 regardless.
rate_limit = 30
popularity_min = 10000
user_start_id = 1001
user_end_id = 1500
# Caps requests spent on any single user. Early AniList accounts have libraries
# in the thousands, and without a low cap one power user can dominate an entire
# ingestion run. Ten pages is ~500 titles, far more than evaluation needs.
user_max_pages = 10
user_per_page = 50
# Attempts per user request. Low on purpose: AniList serves persistent 500s for
# some accounts, and a long backoff spends minutes proving what two tries showed.
user_max_retries = 3

[features]
# Creators come from the AniList `staff` connection, filtered to primary
# authoring roles, and are one-hot encoded into the similarity matrix.
include_authors = true
# Minimum credits an author needs to earn a feature column.
#
# 1 rather than a higher floor, which is not the obvious choice, so: raising the
# floor to 2 discards 1,069 of 1,248 authors and measures no better than
# baseline (recall -0.0017, CI spanning zero). Only the unfiltered arm separates
# from its shuffled control. The intuition that singleton columns are dead
# weight is wrong here because they still shape vector norms.
#
# There is also no cost to pay. Feature width affects training only -- which
# takes under a second -- and not the served artifact, since the similarity
# matrix is items x items at 965 x 965 however many features produced it.
#
# Read scripts/author_ablation.py before tuning this; the effect is small
# enough that it is easy to fit noise.
author_min_titles = 1

[mlflow]
experiment_name = "manga_cosine_recommender"

[recommendation]
default_top_n = 5
# Display cap only; similarity is still computed over every tag. AniList returns
# tags sorted by community rank, so this keeps the most relevant ones. Titles
# carry up to 82 tags, which is unreadable in the UI and dominates the payload.
max_tags = 8

[serving]
# Where the API reads its similarity matrix and metadata from.
#   "auto"         - prefer the baked-in bundle, fall back to the object store
#   "bundle"       - bundle only; no network and no credentials required
#   "object_store" - always fetch the newest published partition
# The whole serving path needs ~8 MB of artifacts, so a deployed image can carry
# them and run with no bucket at all. The pipeline still uses the object store.
artifact_source = "auto"
bundle_dir = "artifacts/serving"

[evaluation]
min_user_interactions = 5
test_fraction = 20
k = 10
random_seed = 42
