services:
  - type: web
    name: manga-recs-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # All set as secrets in the Render dashboard (sync: false = never in the repo).
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      # S3-compatible endpoint. Set to https://<account-id>.r2.cloudflarestorage.com
      # for Cloudflare R2; leave unset to use AWS S3.
      - key: MANGA_RECS_S3_ENDPOINT_URL
        sync: false
      - key: MANGA_RECS_S3_BUCKET
        sync: false
      # Comma-separated allowed frontend origins, e.g. https://manga-recs.vercel.app
      - key: MANGA_RECS_CORS_ORIGINS
        sync: false
