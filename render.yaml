# Kept as a second deployment target. The image is self-contained -- it bakes in
# the similarity matrix, the title metadata and the built UI -- so unlike the
# earlier split deployment this needs no credentials, no bucket, and no CORS
# allowlist. Render injects PORT and the Dockerfile's CMD honours it, so nothing
# here has to know about 7860.
#
# Hugging Face Spaces is the primary target; see DEPLOYMENT.md.
services:
  - type: web
    name: manga-recs
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Serve strictly from the baked-in bundle and never reach for an object
      # store. Already the Dockerfile default; set explicitly so that a
      # misconfiguration fails loudly here rather than silently falling back to
      # a network call this service has no credentials for.
      - key: MANGA_RECS_ARTIFACT_SOURCE
        value: bundle
      # Render terminates TLS in front of the container, so without this every
      # visitor shares one apparent address and the rate limiter treats them as
      # a single client.
      - key: MANGA_RECS_TRUST_FORWARDED_FOR
        value: "true"
