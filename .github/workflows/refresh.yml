name: Refresh model

# Weekly retrain against live AniList data. This is the scheduler that actually
# runs in production; the Airflow setup under airflow/ is the local equivalent
# used to develop and debug the same DAG shape.
on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      partition:
        description: "Partition to write (YYYY-MM-DD). Defaults to today."
        required: false
        type: string

jobs:
  refresh:
    name: Ingest, train, evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      MANGA_RECS_S3_ENDPOINT_URL: ${{ secrets.MANGA_RECS_S3_ENDPOINT_URL }}
      MANGA_RECS_S3_BUCKET: ${{ secrets.MANGA_RECS_S3_BUCKET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: pip install -e .

      - name: Resolve partition
        id: partition
        run: |
          PARTITION="${{ inputs.partition }}"
          if [ -z "$PARTITION" ]; then PARTITION=$(date -u +%F); fi
          echo "value=$PARTITION" >> "$GITHUB_OUTPUT"
          echo "Writing partition $PARTITION"

      - name: Run data pipeline
        run: manga-recs pipeline --partition "${{ steps.partition.outputs.value }}"

      - name: Train model
        run: manga-recs train --partition "${{ steps.partition.outputs.value }}"

      - name: Evaluate model
        run: manga-recs evaluate --partition "${{ steps.partition.outputs.value }}" | tee metrics.txt

      - name: Publish metrics to the run summary
        if: always()
        run: |
          {
            echo "## Model refresh — partition ${{ steps.partition.outputs.value }}"
            echo ""
            echo '```'
            cat metrics.txt 2>/dev/null || echo "no metrics produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-metrics
          path: |
            metrics.txt
            artifacts/models/evaluation_metrics.json
          if-no-files-found: ignore
