[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "manga-recs"
version = "0.1.0"
description = "A manga recommendation including data ingestion + ml package"
requires-python = ">=3.10"
authors = [
    { name="Manny Kim", email="emmanuelkim2004@gmail.com" }
]
# Serving only. Deliberately excludes boto3, mlflow, scikit-learn and pyarrow:
# inference loads a pickled matrix, reads a gzipped JSON table, and does fuzzy
# string matching, so it needs none of them. pyarrow alone is 143 MB installed
# and existed solely to read one 0.5 MB Parquet file at startup, which is why
# the bundle stores that table as JSON instead.
#
# Upper bounds are pinned to the next major so a breaking release cannot change
# what a rebuilt image does, while patch and minor updates still flow in.
dependencies = [
    "fastapi>=0.110,<1.0",
    "joblib>=1.3,<2.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "prometheus-client>=0.20,<1.0",
    "pydantic>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
    "rapidfuzz>=3.9,<4.0",
    "tomli>=2.0,<3.0; python_version < '3.11'",
    "uvicorn>=0.29,<1.0",
    # Tracing ships in the serving image because it is only useful if it is
    # always on; the exporter is a no-op until one is configured.
    "opentelemetry-api>=1.24,<2.0",
    "opentelemetry-sdk>=1.24,<2.0",
]

[project.optional-dependencies]
# Everything the ingest -> clean -> features -> train -> evaluate path needs and
# the API does not.
pipeline = [
    "boto3>=1.34,<2.0",
    "mlflow>=2.12,<4.0",
    # Every stage between ingest and train reads and writes Parquet; only
    # serving avoids it.
    "pyarrow>=15.0,<26.0",
    "requests>=2.31,<3.0",
    "scikit-learn>=1.4,<2.0",
]
otlp = [
    "opentelemetry-exporter-otlp-proto-http>=1.24,<2.0",
]
dev = [
    "manga-recs[pipeline]",
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.4,<1.0",
]

[project.scripts]
manga-recs = "manga_recs.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"manga_recs.data.extract.queries" = ["*.graphql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a running MinIO instance",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4"]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # FastAPI depends on function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # conftest sets env vars before importing the package